<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжные предсказания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: radial-gradient(circle at center, #14122a 0%, #050510 60%, #000000 100%);
            --card-bg: rgba(15, 15, 25, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --title-color: #ffffff;
            --text-color: #cccccc;
            --accent-color: #888888;
            --btn-bg: linear-gradient(145deg, #222, #111);
            --glow-color: rgba(160, 180, 255, 0.15);
        }

        /* ---------- ПЛАМЯ: ЗАКАТ ---------- */
        body.theme-flame {
            --bg-gradient: linear-gradient(to bottom,
                #1a0520 0%, #3d0a2e 18%, #6b1520 42%,
                #a8322a 68%, #d97030 86%, #f0b060 100%);
            --card-bg: rgba(20, 8, 10, 0.85);
            --card-border: rgba(255, 140, 80, 0.3);
            --title-color: #ffd0a0;
            --text-color: #f5dcc0;
            --accent-color: #ff9050;
            --btn-bg: linear-gradient(145deg, #3a1a0e, #1a0804);
            --glow-color: rgba(255, 120, 40, 0.35);
        }

        /* ---------- МОНСТРЫ ---------- */
        body.theme-steel {
            --bg-gradient: radial-gradient(circle at top, #1a1a1f 0%, #050505 100%);
            --card-bg: rgba(18, 18, 20, 0.9);
            --card-border: rgba(168, 42, 42, 0.4);
            --title-color: #e0e0e5;
            --text-color: #a0a0a5;
            --accent-color: #a82a2a;
            --btn-bg: linear-gradient(145deg, #2e2e32, #151518);
            --glow-color: rgba(168, 42, 42, 0.3);
        }

        /* ---------- САНТА БОЙ ---------- */
        body.theme-santa {
            --bg-gradient: linear-gradient(to bottom,
                #1a0410 0%, #3a0a24 25%, #5c1238 50%,
                #8a1c50 75%, #b82a66 100%);
            --card-bg: rgba(38, 8, 22, 0.88);
            --card-border: rgba(255, 140, 190, 0.4);
            --title-color: #ffc0dc;
            --text-color: #ffe0ec;
            --accent-color: #ff6fa8;
            --btn-bg: linear-gradient(145deg, #4a1830, #280818);
            --glow-color: rgba(255, 110, 170, 0.4);
        }

        /* ---------- СМОЛЬ ---------- */
        body.theme-sapphires {
            --bg-gradient: radial-gradient(circle at center, #0a1930 0%, #010205 100%);
            --card-bg: rgba(5, 12, 24, 0.88);
            --card-border: rgba(26, 68, 161, 0.4);
            --title-color: #8ab4f8;
            --text-color: #a0c0e0;
            --accent-color: #1a44a1;
            --btn-bg: linear-gradient(145deg, #0d1f3d, #050b14);
            --glow-color: rgba(26, 68, 161, 0.3);
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
            cursor: none;
        }

        /* ================= КУРСОР ================= */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 50px;
            height: 50px;
            object-fit: contain;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }
        #custom-cursor.active { display: block; }

        /* ================= ФОНОВЫЕ ЭФФЕКТЫ ================= */
        .bg-effect {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
            overflow: hidden;
        }
        .bg-effect.active { opacity: 1; }

        /* ---------- НЕЙТРАЛЬНЫЙ: мистические руны ---------- */
        .glyph {
            position: absolute;
            bottom: -60px;
            color: rgba(180, 200, 255, 0.85);
            text-shadow:
                0 0 10px rgba(150, 180, 255, 0.9),
                0 0 22px rgba(110, 150, 255, 0.5);
            animation: float-glyph linear infinite;
            user-select: none;
            will-change: transform, opacity;
        }
        @keyframes float-glyph {
            0%   { transform: translateY(0)      rotate(0deg)   scale(0.8); opacity: 0; }
            10%  { opacity: 0.95; }
            85%  { opacity: 0.55; }
            100% { transform: translateY(-115vh) rotate(340deg) scale(1.1); opacity: 0; }
        }

        /* ---------- ПЛАМЯ: закатные звёзды ---------- */
        .star {
            position: absolute;
            background: #fff5e0;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 220, 160, 0.9), 0 0 15px rgba(255, 180, 100, 0.45);
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.6); }
            50%      { opacity: 1;    transform: scale(1.3); }
        }
        .sun-glow {
            position: absolute;
            left: 50%; bottom: -180px;
            transform: translateX(-50%);
            width: 900px; height: 500px;
            background: radial-gradient(ellipse at center,
                rgba(255, 190, 90, 0.55) 0%,
                rgba(255, 120, 40, 0.3) 35%,
                rgba(180, 40, 40, 0) 75%);
            border-radius: 50%;
            filter: blur(20px);
            animation: sun-pulse ease-in-out infinite alternate;
        }
        @keyframes sun-pulse {
            0%   { opacity: 0.7; transform: translateX(-50%) scale(1); }
            100% { opacity: 1;   transform: translateX(-50%) scale(1.08); }
        }

        /* ---------- МОНСТРЫ: кровавые искры ---------- */
        .ash {
            position: absolute; background: #ff4d4d; border-radius: 50%;
            animation: fall linear infinite; opacity: 0.9;
            box-shadow: 0 0 10px #ff4d4d, 0 0 20px #a82a2a;
        }
        @keyframes fall {
            0%   { transform: translateY(-100vh) translateX(0) scale(1);      opacity: 0; }
            20%  { opacity: 1; } 80% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(30px) scale(0.5);  opacity: 0; }
        }

        /* ---------- САНТА БОЙ: снег ---------- */
        .snow-dot {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 210, 235, 0.9);
            animation: snow-fall linear infinite;
        }
        @keyframes snow-fall {
            0%   { transform: translateY(-10vh) translateX(0)    rotate(0deg);   opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .snow-flake {
            position: absolute;
            color: #ffe0f0;
            text-shadow: 0 0 8px rgba(255, 180, 220, 0.9);
            animation: snow-fall linear infinite;
            user-select: none;
        }

        /* ---------- САНТА БОЙ: ёлочные шары ---------- */
        .ornament {
            position: absolute;
            border-radius: 50%;
            animation: ornament-float ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        @keyframes ornament-float {
            0%   { transform: translateY(0)      scale(0.75); opacity: 0.35; }
            100% { transform: translateY(-25px)  scale(1.2);  opacity: 0.95; }
        }

        /* ---------- САНТА БОЙ: сердечки ---------- */
        .heart {
            position: absolute;
            bottom: -60px;
            animation: float-heart linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 110, 170, 0.9));
            user-select: none;
            will-change: transform, opacity;
        }
        @keyframes float-heart {
            0%   { transform: translateY(0)      translateX(0)   rotate(-15deg) scale(0.6);  opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 0.9; }
            100% { transform: translateY(-115vh) translateX(40px) rotate(15deg)  scale(1.15); opacity: 0; }
        }

        /* ---------- САНТА БОЙ: рождественские атрибуты ---------- */
        .christmas-attr {
            position: absolute;
            animation: attr-twinkle ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 210, 100, 0.9));
            user-select: none;
            will-change: transform, opacity;
        }
        @keyframes attr-twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.65) rotate(-12deg); }
            50%      { opacity: 1;    transform: scale(1.25) rotate(12deg); }
        }

        /* ---------- СМОЛЬ: туман ---------- */
        .fog {
            position: absolute;
            background: radial-gradient(circle, rgba(77, 136, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: float-side linear infinite alternate;
        }
        @keyframes float-side {
            0%   { transform: translateX(-80px) scale(1);   opacity: 0.2; }
            100% { transform: translateX(80px)  scale(1.2); opacity: 0.7; }
        }

        /* ================= ЭКРАНЫ ================= */
        .screen {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 20;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        .selection-container { text-align: center; width: 90%; max-width: 900px; z-index: 25; }
        .selection-title {
            color: #fff; font-size: 32px; letter-spacing: 8px;
            text-transform: uppercase; margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(160, 180, 255, 0.5);
        }
        .books-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
        }
        .book-btn {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 30px 20px; color: #fff;
            font-family: 'Georgia', serif; font-size: 18px; cursor: none;
            transition: all 0.3s ease; height: 150px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .book-btn span { font-size: 14px; opacity: 0.5; margin-top: 10px; font-style: italic; }
        .book-btn:hover {
            transform: translateY(-5px); background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .book-btn[data-book="flame"]:hover     { border-color: #ff9050; color: #ffd0a0; }
        .book-btn[data-book="steel"]:hover     { border-color: #a82a2a; color: #d0d0d5; }
        .book-btn[data-book="santa"]:hover     { border-color: #ff6fa8; color: #ffc0dc; }
        .book-btn[data-book="sapphires"]:hover { border-color: #1a44a1; color: #8ab4f8; }

        .card-wrapper { position: relative; z-index: 25; width: 90%; max-width: 560px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--card-border); border-radius: 25px;
            padding: 35px 25px; text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 60px var(--glow-color);
            transition: all 0.6s ease; position: relative;
        }
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: transparent; border: 1px solid var(--card-border);
            color: var(--accent-color); padding: 8px 15px; border-radius: 20px;
            cursor: none; font-family: 'Georgia', serif; font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: var(--btn-bg); border-color: var(--accent-color); }
        .card h1 {
            font-size: 26px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--title-color); text-shadow: 0 0 20px var(--glow-color);
            margin-bottom: 5px; margin-top: 15px; transition: color 0.6s;
        }
        .card .author {
            font-size: 16px; letter-spacing: 6px; color: var(--accent-color);
            font-style: italic; border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px; margin-bottom: 20px; transition: color 0.6s;
        }
        .prediction-box {
            min-height: 140px; display: flex; align-items: center; justify-content: center;
            padding: 15px; margin-bottom: 25px; border-radius: 15px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
            transition: border 0.6s;
        }
        .prediction-text {
            font-size: 19px; line-height: 1.5; color: var(--text-color);
            font-style: italic; text-shadow: 0 0 20px var(--glow-color);
            transition: opacity 0.4s ease, transform 0.4s ease, color 0.6s;
        }
        .prediction-text.fade { opacity: 0; transform: scale(0.95); }
        .btn {
            padding: 14px 40px; background: var(--btn-bg); color: var(--title-color);
            font-size: 16px; font-family: 'Georgia', serif; letter-spacing: 2px;
            text-transform: uppercase; border: 1px solid var(--card-border);
            border-radius: 50px; cursor: none; transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); border-color: var(--accent-color); }

        @media (max-width: 640px) {
            .card { padding: 25px 15px; }
            .card h1 { font-size: 20px; }
            .prediction-text { font-size: 16px; }
            .books-grid { grid-template-columns: 1fr; }
            .sun-glow { width: 600px; height: 380px; bottom: -140px; }
        }
    </style>
</head>
<body class="theme-neutral">

    <img id="custom-cursor" alt="Курсор">

    <div id="bg-neutral" class="bg-effect active"></div>
    <div id="bg-flame"   class="bg-effect"><div class="sun-glow"></div></div>
    <div id="bg-ash"     class="bg-effect"></div>
    <div id="bg-santa"   class="bg-effect"></div>
    <div id="bg-fog"     class="bg-effect"></div>

    <!-- ЭКРАН 1: ВЫБОР -->
    <div id="selection-screen" class="screen active">
        <div class="selection-container">
            <h1 class="selection-title">Выберите историю</h1>
            <div class="books-grid">
                <button class="book-btn" data-book="flame">Пламя в темноте<span>Таня Нордсвей</span></button>
                <button class="book-btn" data-book="steel">Монстры царства стали<span>Таня Нордсвей</span></button>
                <button class="book-btn" data-book="santa">Санта бой<span>Таня Нордсвей</span></button>
                <button class="book-btn" data-book="sapphires">Смоль и сапфиры<span>Таня Нордсвей</span></button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ПРЕДСКАЗАНИЯ -->
    <div id="prediction-screen" class="screen">
        <div class="card-wrapper">
            <div class="card">
                <button class="back-btn" id="btnBack">← Назад</button>
                <h1 id="bookTitle">Название</h1>
                <div class="author">Таня Нордсвей</div>
                <div class="prediction-box">
                    <div class="prediction-text" id="predictionText">Нажмите на кнопку...</div>
                </div>
                <button class="btn" id="btnPredict">Получить предсказание</button>
            </div>
        </div>
    </div>

            santa: {
                title: "Санта бой",
                theme: "theme-santa",
                effect: "bg-santa",
                cursor: "cute-pinky.gif",
                predictions: [

                    "В этом декабре твоё сердце забьётся чаще. И причиной будет не мороз, а чей-то низкий голос за спиной.",

                    "Тот, кто называет тебя обидным прозвищем, на самом деле ищет повод поговорить с тобой подольше.",

                    "Санта бой уже едет к тебе. С шапкой набок, с улыбкой до ушей и с намерением перевернуть твой мир.",
                    "Тот, кто помогает собирать тебе рюкзак после падения — на самом деле уже давно думает о тебе.",
                    "Если будешь искать свою вторую половинку на балу — выбирай того, кто поднимет тебя, а не того, кто смотрит со стороны.",
                    "Не бойся упасть с небес. Тот, кто тебя поймает, и есть твоя судьба.",
                    "Снег, каток, горячий глинтвейн — идеальный рецепт для первого свидания. Просто добавь Санта боя.",
                    "Тот, кто зовёт тебя Печенькой, любит тебя больше, чем ты думаешь.",
                    "Твои глаза цвета зимнего неба — именно в них кто-то уже пропал безвозвратно.",
                    "Настоящая любовь не отвлекает от мечты — она помогает её достичь. И даже экзамены сдаются легче с любимым рядом.",
                    "Санта-бой существует. Просто он не в санях — он за рулём, в худи, и ждёт тебя у школы.",
                    "Твой самый лучший подарок на Рождество уже стоит под ёлкой — с шапкой на голове и снежинками в волосах.",
                    "Загадывай желание под бой курантов — но будь осторожна: оно может исполниться слишком буквально.",
                    "Пряничный человечек на твоей ёлке может оказаться подвеской на цепочке, подаренной от чистого сердца.",

                    "Рождество — это время, когда все маски снимаются. И ты узнаешь, кто на самом деле любит тебя без макияжа.",
                    "Твой Санта бой уже нашёл тебя среди тысячи лиц. Не упусти его."
                ]
            },
            sapphires: {
                title: "Смоль и сапфиры",
                theme: "theme-sapphires",
                effect: "bg-fog",
                cursor: "cursor-sapphire.gif",
                predictions: [
                    "В мире, полном монстров, питающихся кровью, ты и сама монстр, Лайла. Но любовь способна приручить тьму.",

                    "Сапфир на твоем пальце — не просто украшение. Это ключ к его сердцу.",
                    "Тайны ночи откроются тому, кто не побоится заглянуть в глаза чудовищу.",

                    "Доверие — самая редкая драгоценность. Не разбрасывайся ею.",
                    "Тот, кто охотится на тебя, сам станет твоей добычей.",
                    "Твоя кровь — это дар, а не проклятие. Научись им пользоваться.",
                    "В мире, где правят вампиры, твоя человечность — твое главное оружие.",
                    "Когда смоль смешается с сапфирами, родится нечто новое и прекрасное.",
                    "Он выкупил твою свободу, но ты забрала его сердце. Честная сделка.",
                    "Ты — не жертва. Ты — хищник, который еще не понял своей силы.",
                    "Луна знает твои секреты. Доверься её свету.",
                    "Тот, кто боится тебя, не сможет причинить тебе вреда.",
                    "В темноте легче скрыть свою сущность. Но помни, кто ты.",
                    "Твоя жизнь стоит больше, чем миллион таллинов. Ты бесценна.",
                    "Киран не бросит тебя. Даже в самой кромешной тьме он будет рядом.",
                    "Не позволяй прошлому диктовать твое будущее. Ты сильнее.",
                    "Ищейка найдет тебя, где бы ты ни была. Но найдет ли он твое сердце?",
                    "Твоя уязвимость — это не слабость. Это твоя сила.",
                    "Тот, кто хочет тебя использовать, сам станет инструментом в твоих руках.",
                    "Ночь скрывает много тайн. Но твоя тайна — самая опасная.",
                    "Когда придет время, ты узнаешь, кому можно доверять. А кому — нет.",
                    "Твоя сила — в способности выживать там, где другие сдаются.",
                    "Любовь вампира — это навсегда. Готова ли ты к этому?",
                    "Ты — не просто игрушка в его руках. Ты — его спасение.",
                    "В конце концов, ты сама решишь, кем тебе быть: жертвой или хищником."
                ]
            }
        };

        /* ============ ЭЛЕМЕНТЫ ============ */
        let currentBookId = null;
        const selectionScreen  = document.getElementById('selection-screen');
        const predictionScreen = document.getElementById('prediction-screen');
        const bookTitleEl      = document.getElementById('bookTitle');
        const predText         = document.getElementById('predictionText');
        const btnPredict       = document.getElementById('btnPredict');
        const btnBack          = document.getElementById('btnBack');
        const customCursor     = document.getElementById('custom-cursor');

        /* ============ КУРСОР ============ */
        customCursor.src = DEFAULT_CURSOR;
        customCursor.classList.add('active');

        customCursor.addEventListener('error', () => {
            const key = currentBookId || 'default';
            if (!customCursor.src.startsWith('data:')) {
                console.warn(`❌ Курсор "${customCursor.getAttribute('src')}" не найден — использую SVG для "${key}"`);
                customCursor.src = SVG_CURSORS[key] || SVG_CURSORS.default;
            }
        });

        /* ============ ГЕНЕРАЦИЯ ФОНОВЫХ ЭФФЕКТОВ ============ */
        function generateEffects() {
            // ----- НЕЙТРАЛЬНЫЙ: мистические руны -----
            const neutralCont = document.getElementById('bg-neutral');
            const glyphSymbols = ['✦', '✧', '☾', '☽', '❋', '✺', '✿', '⚜', '❖', '✶', '✷', '✹'];
            for (let i = 0; i < 35; i++) {
                const g = document.createElement('div');
                g.className = 'glyph';
                g.textContent = glyphSymbols[Math.floor(Math.random() * glyphSymbols.length)];
                g.style.fontSize = (Math.random() * 20 + 12) + 'px';
                g.style.left = Math.random() * 100 + '%';
                g.style.bottom = -(Math.random() * 80 + 20) + 'px';
                g.style.animationDuration = (Math.random() * 18 + 16) + 's';
                g.style.animationDelay = -(Math.random() * 25) + 's';
                neutralCont.appendChild(g);
            }

            // ----- ПЛАМЯ: закатные звёзды -----
            const flameCont = document.getElementById('bg-flame');
            for (let i = 0; i < 110; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width  = size + 'px';
                star.style.height = size + 'px';
                star.style.left   = Math.random() * 100 + '%';
                star.style.top    = (Math.random() * Math.random() * 100) + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay    = (Math.random() * 4) + 's';
                flameCont.appendChild(star);
            }

            // ----- МОНСТРЫ: искры -----
            const ashCont = document.getElementById('bg-ash');
            for (let i = 0; i < 80; i++) {
                const a = document.createElement('div');
                a.className = 'ash';
                const size = Math.random() * 4 + 2;
                a.style.width = size + 'px'; a.style.height = size + 'px';
                a.style.left = Math.random() * 100 + '%';
                a.style.animationDuration = (Math.random() * 4 + 3) + 's';
                a.style.animationDelay = (Math.random() * 5) + 's';
                ashCont.appendChild(a);
            }

            // ----- САНТА БОЙ: снег + шары + сердечки + атрибуты -----
            const santaCont = document.getElementById('bg-santa');

            // Снежинки-кружки
            for (let i = 0; i < 60; i++) {
                const s = document.createElement('div');
                s.className = 'snow-dot';
                const size = Math.random() * 3.5 + 1.5;
                s.style.width  = size + 'px';
                s.style.height = size + 'px';
                s.style.left   = Math.random() * 100 + '%';
                s.style.top    = -(Math.random() * 20) + '%';
                s.style.animationDuration = (Math.random() * 6 + 6) + 's';
                s.style.animationDelay    = (Math.random() * 8) + 's';
                santaCont.appendChild(s);
            }

            // Крупные снежинки-символы ❄
            const flakeSymbols = ['❄', '❅', '❆'];
            for (let i = 0; i < 25; i++) {
                const f = document.createElement('div');
                f.className = 'snow-flake';
                f.textContent = flakeSymbols[Math.floor(Math.random() * flakeSymbols.length)];
                f.style.fontSize = (Math.random() * 14 + 10) + 'px';
                f.style.left = Math.random() * 100 + '%';
                f.style.top = -(Math.random() * 20) + '%';
                f.style.animationDuration = (Math.random() * 7 + 8) + 's';
                f.style.animationDelay    = (Math.random() * 10) + 's';
                santaCont.appendChild(f);
            }

            // Ёлочные шары
            const ornamentColors = ['#ff6fa8', '#ffd700', '#ff3a5a', '#ffc0dc', '#ff4d94'];
            for (let i = 0; i < 20; i++) {
                const o = document.createElement('div');
                o.className = 'ornament';
                const size = Math.random() * 12 + 8;
                const color = ornamentColors[Math.floor(Math.random() * ornamentColors.length)];
                o.style.width  = size + 'px';
                o.style.height = size + 'px';
                o.style.left   = Math.random() * 100 + '%';
                o.style.top    = Math.random() * 100 + '%';
                o.style.background = `radial-gradient(circle at 30% 30%, #fff8, ${color} 60%, ${color})`;
                o.style.boxShadow = `0 0 15px ${color}, 0 0 30px ${color}66`;
                o.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                o.style.animationDelay    = (Math.random() * 3) + 's';
                santaCont.appendChild(o);
            }

            // Сердечки
            const heartSymbols = ['💖', '💕', '💗', '❤️', '💓', '💝', '💘'];
            for (let i = 0; i < 28; i++) {
                const h = document.createElement('div');
                h.className = 'heart';
                h.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                h.style.fontSize = (Math.random() * 18 + 14) + 'px';
                h.style.left = Math.random() * 100 + '%';
                h.style.bottom = -(Math.random() * 80 + 20) + 'px';
                h.style.animationDuration = (Math.random() * 9 + 8) + 's';
                h.style.animationDelay = -(Math.random() * 18) + 's';
                santaCont.appendChild(h);
            }

            // Рождественские атрибуты
            const xmasSymbols = ['⭐', '🌟', '✨', '🔔', '🍬', '🍭', '🎄', '🎁', '🧦'];
            for (let i = 0; i < 32; i++) {
                const x = document.createElement('div');
                x.className = 'christmas-attr';
                x.textContent = xmasSymbols[Math.floor(Math.random() * xmasSymbols.length)];
                x.style.fontSize = (Math.random() * 14 + 12) + 'px';
                x.style.left = Math.random() * 100 + '%';
                x.style.top = Math.random() * 100 + '%';
                x.style.animationDuration = (Math.random() * 3 + 2) + 's';
                x.style.animationDelay = (Math.random() * 4) + 's';
                santaCont.appendChild(x);
            }

            // ----- СМОЛЬ: туман -----
            const fogCont = document.getElementById('bg-fog');
            for (let i = 0; i < 12; i++) {
                const f = document.createElement('div');
                f.className = 'fog';
                const size = Math.random() * 300 + 150;
                f.style.width = size + 'px'; f.style.height = size + 'px';
                f.style.left = Math.random() * 100 + '%';
                f.style.top = Math.random() * 100 + '%';
                f.style.animationDuration = (Math.random() * 8 + 8) + 's';
                f.style.animationDelay = (Math.random() * 5) + 's';
                fogCont.appendChild(f);
            }
        }
        generateEffects();

        /* ============ ЛОГИКА КНИГ ============ */
        document.querySelectorAll('.book-btn').forEach(btn => {
            btn.addEventListener('click', () => openBook(btn.getAttribute('data-book')));
        });

        function setActiveEffect(effectId) {
            document.querySelectorAll('.bg-effect').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(effectId);
            if (el) el.classList.add('active');
        }

        function openBook(bookId) {
            currentBookId = bookId;
            const book = booksData[bookId];

            document.body.className = book.theme;
            setActiveEffect(book.effect || 'bg-neutral');

            if (book.cursor) {
                customCursor.src = book.cursor;
            } else {
                customCursor.src = SVG_CURSORS[bookId] || SVG_CURSORS.default;
            }
            customCursor.classList.add('active');

            bookTitleEl.textContent = book.title;
            predText.textContent = getRandomPrediction(book.predictions);

            selectionScreen.classList.remove('active');
            predictionScreen.classList.add('active');
        }

        function goBack() {
            predictionScreen.classList.remove('active');
            selectionScreen.classList.add('active');

            document.body.className = 'theme-neutral';
            setActiveEffect('bg-neutral');

            currentBookId = null;
            customCursor.src = DEFAULT_CURSOR;
        }

        btnBack.addEventListener('click', goBack);

        function getRandomPrediction(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        btnPredict.addEventListener('click', () => {
            if (!currentBookId) return;
            const book = booksData[currentBookId];
            predText.classList.add('fade');
            setTimeout(() => {
                predText.textContent = getRandomPrediction(book.predictions);
                predText.classList.remove('fade');
            }, 350);
        });

        /* ============ ДВИЖЕНИЕ КУРСОРА ============ */
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top  = e.clientY + 'px';
        });
    </script>
</body>
</html>
