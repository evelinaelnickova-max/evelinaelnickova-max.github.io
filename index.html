<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжные предсказания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==================== ПЕРЕМЕННЫЕ ТЕМ ==================== */
        :root {
            /* Тема по умолчанию */
            --bg-gradient: radial-gradient(ellipse at center, #0d0505 0%, #050202 50%, #000000 100%);
            --card-bg: rgba(8, 4, 4, 0.82);
            --card-border: rgba(200, 120, 50, 0.25);
            --title-color: #e8c39e;
            --text-color: #f0e0d0;
            --accent-color: #d49c6b;
            --btn-bg: linear-gradient(145deg, #2a1a0e, #1a0e06);
            --flame-color-1: rgba(255, 80, 0, 0.25);
            --flame-color-2: rgba(255, 150, 0, 0.20);
        }

        body.theme-flame {
            --bg-gradient: radial-gradient(ellipse at center, #0d0505 0%, #050202 50%, #000000 100%);
            --card-bg: rgba(8, 4, 4, 0.82);
            --card-border: rgba(200, 120, 50, 0.25);
            --title-color: #e8c39e;
            --text-color: #f0e0d0;
            --accent-color: #d49c6b;
            --btn-bg: linear-gradient(145deg, #2a1a0e, #1a0e06);
            --flame-color-1: rgba(255, 80, 0, 0.25);
            --flame-color-2: rgba(255, 150, 0, 0.20);
        }

        body.theme-steel {
            /* Монстры царства стали */
            --bg-gradient: radial-gradient(ellipse at center, #1c1c1f 0%, #0a0a0c 60%, #000 100%);
            --card-bg: rgba(15, 15, 18, 0.9);
            --card-border: rgba(180, 180, 190, 0.3);
            --title-color: #d0d0d5;
            --text-color: #b0b0b5;
            --accent-color: #a82a2a;
            --btn-bg: linear-gradient(145deg, #2a2a2e, #151518);
            --flame-color-1: rgba(168, 42, 42, 0.25);
            --flame-color-2: rgba(80, 80, 90, 0.2);
        }

        body.theme-house {
            /* Дом */
            --bg-gradient: radial-gradient(ellipse at center, #3d2b10 0%, #1a1205 60%, #0a0802 100%);
            --card-bg: rgba(30, 20, 10, 0.85);
            --card-border: rgba(212, 175, 55, 0.3);
            --title-color: #f4d03f;
            --text-color: #e0c080;
            --accent-color: #d4af37;
            --btn-bg: linear-gradient(145deg, #4a3412, #2a1d08);
            --flame-color-1: rgba(212, 175, 55, 0.25);
            --flame-color-2: rgba(255, 220, 100, 0.15);
        }

        body.theme-sapphires {
            /* Смоль и сапфиры */
            --bg-gradient: radial-gradient(ellipse at center, #050b14 0%, #020408 60%, #000 100%);
            --card-bg: rgba(5, 12, 24, 0.88);
            --card-border: rgba(26, 68, 161, 0.4);
            --title-color: #8ab4f8;
            --text-color: #a0c0e0;
            --accent-color: #1a44a1;
            --btn-bg: linear-gradient(145deg, #0d1f3d, #050b14);
            --flame-color-1: rgba(26, 68, 161, 0.25);
            --flame-color-2: rgba(138, 180, 248, 0.15);
        }

        /* ==================== ОБЩИЕ СТИЛИ ==================== */
        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            cursor: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.6s ease;
        }

        /* Контейнер дракона */
        #dragon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            will-change: transform;
            transition: transform 0.06s ease-out;
            opacity: 0; /* Скрыт на экране выбора */
            transition: opacity 0.5s ease, transform 0.06s ease-out;
        }

        #dragon-container.visible {
            opacity: 1;
        }

        #dragon-container img {
            display: block;
            width: 300px;
            height: auto;
            filter: drop-shadow(0 0 40px var(--flame-color-1));
            image-rendering: auto;
            transform-origin: center;
        }

        /* Кастомный курсор */
        #cursor-fire {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            filter: blur(8px);
            opacity: 0.7;
        }

        /* Звёзды */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 6px rgba(255, 215, 150, 0.5);
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Пламя внизу */
        .flames {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(ellipse at 30% 100%, var(--flame-color-1) 0%, transparent 70%),
                        radial-gradient(ellipse at 70% 100%, var(--flame-color-2) 0%, transparent 70%);
            animation: flicker 3s infinite alternate;
            transition: background 0.6s ease;
        }
        @keyframes flicker {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        /* ==================== ЭКРАНЫ ==================== */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 20;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==================== ЭКРАН ВЫБОРА КНИГ ==================== */
        .selection-container {
            text-align: center;
            width: 90%;
            max-width: 900px;
            z-index: 25;
        }

        .selection-title {
            color: #fff;
            font-size: 32px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            font-family: 'Palatino', 'Georgia', serif;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .book-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            color: #fff;
            font-family: 'Georgia', serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 150px;
        }

        .book-btn span {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 10px;
            font-style: italic;
        }

        .book-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .book-btn[data-book="flame"]:hover { border-color: #e8c39e; color: #e8c39e; box-shadow: 0 0 20px rgba(232, 195, 158, 0.2); }
        .book-btn[data-book="steel"]:hover { border-color: #a82a2a; color: #d0d0d5; box-shadow: 0 0 20px rgba(168, 42, 42, 0.2); }
        .book-btn[data-book="house"]:hover { border-color: #d4af37; color: #f4d03f; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .book-btn[data-book="sapphires"]:hover { border-color: #1a44a1; color: #8ab4f8; box-shadow: 0 0 20px rgba(26, 68, 161, 0.2); }

        /* ==================== КАРТОЧКА ПРЕДСКАЗАНИЙ ==================== */
        .card-wrapper {
            position: relative;
            z-index: 25;
            width: 90%;
            max-width: 560px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 32px 24px 38px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 0 0 80px var(--flame-color-1);
            pointer-events: auto;
            transition: all 0.6s ease;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--accent-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--btn-bg);
            border-color: var(--accent-color);
        }

        .card h1 {
            font-size: 28px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--title-color);
            text-shadow: 0 0 25px var(--flame-color-1);
            margin-bottom: 4px;
            margin-top: 10px;
            font-family: 'Palatino', 'Georgia', serif;
            transition: color 0.6s;
        }

        .card .author {
            font-size: 17px;
            letter-spacing: 7px;
            color: var(--accent-color);
            opacity: 0.8;
            font-style: italic;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 14px;
            margin-bottom: 22px;
            transition: color 0.6s;
        }

        .card .subtitle {
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 22px;
            font-style: italic;
            transition: color 0.6s;
        }

        .prediction-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 12px;
            margin-bottom: 24px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--card-border);
            transition: border 0.6s;
        }

        .prediction-text {
            font-size: 20px;
            line-height: 1.5;
            color: var(--text-color);
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 0 30px var(--flame-color-2);
            transition: opacity 0.4s ease, transform 0.4s ease, color 0.6s;
        }

        .prediction-text.fade {
            opacity: 0;
            transform: scale(0.95);
        }

        .btn {
            padding: 13px 38px;
            background: var(--btn-bg);
            color: var(--title-color);
            font-size: 17px;
            font-family: 'Georgia', serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid var(--card-border);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 0 50px var(--flame-color-1);
        }

        .btn:active {
            transform: translateY(0px);
        }

        /* Адаптив */
        @media (max-width: 640px) {
            #dragon-container img { width: 200px; }
            .card { padding: 24px 16px 30px; }
            .card h1 { font-size: 22px; letter-spacing: 2px; }
            .card .author { font-size: 14px; letter-spacing: 4px; }
            .prediction-text { font-size: 17px; }
            .btn { font-size: 14px; padding: 11px 28px; }
            #cursor-fire { width: 30px; height: 30px; filter: blur(5px); }
            .selection-title { font-size: 24px; letter-spacing: 4px; }
            .books-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 400px) {
            #dragon-container img { width: 150px; }
        }
    </style>
</head>
<body>

    <!-- Дракон (показывается только на экране предсказаний) -->
    <div id="dragon-container">

    <!-- ЭКРАН 1: ВЫБОР КНИГИ (по умолчанию активен) -->

                    Монстры царства стали

                    "Киран — не тот, кем кажется. Его тьма — лишь защита от еще большей боли.",
                    "Доверие — самая редкая драгоценность. Не разбрасывайся ею.",
                    "Тот, кто охотится на тебя, сам станет твоей добычей.",
                    "Твоя кровь — это дар, а не проклятие. Научись им пользоваться.",
                    "В мире, где правят вампиры, твоя человечность — твое главное оружие.",
                    "Когда смоль смешается с сапфирами, родится нечто новое и прекрасное.",
                    "Он выкупил твою свободу, но ты забрала его сердце. Честная сделка.",
                    "Ты — не жертва. Ты — хищник, который еще не понял своей силы."
                ]
            }
        };

        // ---------- ЛОГИКА ЭКРАНОВ ----------
        let currentBookId = null;
        
        const selectionScreen = document.getElementById('selection-screen');
        const predictionScreen = document.getElementById('prediction-screen');
        const dragonContainer = document.getElementById('dragon-container');
        
        const bookTitleEl = document.getElementById('bookTitle');
        const bookSubtitleEl = document.getElementById('bookSubtitle');
        const predText = document.getElementById('predictionText');
        const btnPredict = document.getElementById('btnPredict');
        const btnBack = document.getElementById('btnBack');

        // Обработчики выбора книги
        document.querySelectorAll('.book-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const bookId = btn.getAttribute('data-book');
                openBook(bookId);
            });
        });

        function openBook(bookId) {
            currentBookId = bookId;
            const book = booksData[bookId];

            // Меняем тему (цвета фона и элементов)
            document.body.className = book.theme;
            
            // Обновляем тексты
            bookTitleEl.textContent = book.title;
            bookSubtitleEl.textContent = book.subtitle;
            
            // Ставим случайное предсказание при входе
            predText.textContent = getRandomPrediction(book.predictions);

            // Переключаем экраны
            selectionScreen.classList.remove('active');
            predictionScreen.classList.add('active');
            
            // Показываем дракона
            dragonContainer.classList.add('visible');
        }

        function goBack() {
            // Скрываем экран предсказаний
            predictionScreen.classList.remove('active');
            
            // Показываем экран выбора
            selectionScreen.classList.add('active');
            
            // Прячем дракона
            dragonContainer.classList.remove('visible');
            
            // Возвращаем дефолтную тему
            document.body.className = ''; 
            
            currentBookId = null;
        }

        btnBack.addEventListener('click', goBack);

        // Логика предсказаний
        function getRandomPrediction(predictionsArray) {
            const random = Math.floor(Math.random() * predictionsArray.length);
            return predictionsArray[random];
        }

        btnPredict.addEventListener('click', () => {
            if (!currentBookId) return;
            
            const book = booksData[currentBookId];
            const newText = getRandomPrediction(book.predictions);
            
            predText.classList.add('fade');
            setTimeout(() => {
                predText.textContent = newText;
                predText.classList.remove('fade');
            }, 350);
        });


        // ---------- СЛЕДОВАНИЕ ДРАКОНА ЗА КУРСОРОМ ----------
        const container = document.getElementById('dragon-container');
        const cursorFire = document.getElementById('cursor-fire');
        const dragonImg = document.getElementById('dragonImg');

        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;
        let currentX = targetX;
        let currentY = targetY;

        let dragonW = 300;
        let dragonH = 250;

        function updateDragonSize() {
            const rect = dragonImg.getBoundingClientRect();
            if (rect.width) {
                dragonW = rect.width;
                dragonH = rect.height;
            }
        }
        window.addEventListener('load', () => setTimeout(updateDragonSize, 200));
        window.addEventListener('resize', () => setTimeout(updateDragonSize, 200));

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            cursorFire.style.left = targetX + 'px';
            cursorFire.style.top = targetY + 'px';
        });

        function followDragon() {
            const dx = targetX - currentX;
            const dy = targetY - currentY;
            const ease = 0.10;
            currentX += dx * ease;
            currentY += dy * ease;
            const offsetX = dragonW / 2;
            const offsetY = dragonH / 2;
            container.style.transform = `translate(${currentX - offsetX}px, ${currentY - offsetY}px)`;
            requestAnimationFrame(followDragon);
        }
        followDragon();

        // ---------- ЗВЁЗДЫ ----------
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 130; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = (Math.random() * 6) + 's';
            star.style.opacity = Math.random() * 0.5 + 0.15;
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
