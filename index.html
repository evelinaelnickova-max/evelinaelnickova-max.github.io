<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжные предсказания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: radial-gradient(circle at center, #14122a 0%, #050510 60%, #000000 100%);
            --card-bg: rgba(15, 15, 25, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --title-color: #ffffff;
            --text-color: #cccccc;
            --accent-color: #888888;
            --btn-bg: linear-gradient(145deg, #222, #111);
            --glow-color: rgba(160, 180, 255, 0.15);
        }

        body.theme-flame {
            --bg-gradient: radial-gradient(ellipse at center, #0d0505 0%, #050202 50%, #000000 100%);
            --card-bg: rgba(8, 4, 4, 0.82);
            --card-border: rgba(200, 120, 50, 0.25);
            --title-color: #e8c39e;
            --text-color: #f0e0d0;
            --accent-color: #d49c6b;
            --btn-bg: linear-gradient(145deg, #2a1a0e, #1a0e06);
            --glow-color: rgba(255, 80, 0, 0.25);
        }
        body.theme-steel {
            --bg-gradient: radial-gradient(circle at top, #1a1a1f 0%, #050505 100%);
            --card-bg: rgba(18, 18, 20, 0.9);
            --card-border: rgba(168, 42, 42, 0.4);
            --title-color: #e0e0e5;
            --text-color: #a0a0a5;
            --accent-color: #a82a2a;
            --btn-bg: linear-gradient(145deg, #2e2e32, #151518);
            --glow-color: rgba(168, 42, 42, 0.3);
        }
        body.theme-house {
            --bg-gradient: linear-gradient(to bottom, #3d2b10 0%, #0a0802 100%);
            --card-bg: rgba(30, 20, 10, 0.85);
            --card-border: rgba(212, 175, 55, 0.3);
            --title-color: #f4d03f;
            --text-color: #e0c080;
            --accent-color: #d4af37;
            --btn-bg: linear-gradient(145deg, #4a3412, #2a1d08);
            --glow-color: rgba(212, 175, 55, 0.2);
        }
        body.theme-sapphires {
            --bg-gradient: radial-gradient(circle at center, #0a1930 0%, #010205 100%);
            --card-bg: rgba(5, 12, 24, 0.88);
            --card-border: rgba(26, 68, 161, 0.4);
            --title-color: #8ab4f8;
            --text-color: #a0c0e0;
            --accent-color: #1a44a1;
            --btn-bg: linear-gradient(145deg, #0d1f3d, #050b14);
            --glow-color: rgba(26, 68, 161, 0.3);
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
            cursor: none;
        }

        /* ================= КУРСОР ================= */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 50px;
            height: 50px;
            object-fit: contain;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }
        #custom-cursor.active { display: block; }

        /* ================= ФОНОВЫЕ ЭФФЕКТЫ ================= */
        .bg-effect {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
            overflow: hidden;
        }
        .bg-effect.active { opacity: 1; }

        /* ---------- НЕЙТРАЛЬНЫЙ: мерцающие звёзды ---------- */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(200, 210, 255, 0.9);
            animation: twinkle ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50%      { opacity: 1;    transform: scale(1.3); }
        }

        /* ---------- НЕЙТРАЛЬНЫЙ: плывущие светящиеся пылинки ---------- */
        .dust {
            position: absolute;
            background: radial-gradient(circle, rgba(180, 200, 255, 0.9) 0%, rgba(120, 160, 255, 0.4) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(1px);
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1);        opacity: 0; }
            15%  { opacity: 0.85; }
            85%  { opacity: 0.85; }
            100% { transform: translate(60px, -110vh) scale(0.6); opacity: 0; }
        }

        /* ---------- МОНСТРЫ: кровавые искры ---------- */
        .ash {
            position: absolute; background: #ff4d4d; border-radius: 50%;
            animation: fall linear infinite; opacity: 0.9;
            box-shadow: 0 0 10px #ff4d4d, 0 0 20px #a82a2a;
        }
        @keyframes fall {
            0%   { transform: translateY(-100vh) translateX(0) scale(1);      opacity: 0; }
            20%  { opacity: 1; } 80% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(30px) scale(0.5);  opacity: 0; }
        }

        /* ---------- ДОМ: золотой песок ---------- */
        .sand {
            position: absolute; background: #ffd700; border-radius: 2px;
            animation: blow linear infinite; opacity: 0.8;
            box-shadow: 0 0 5px #ffd700;
        }
        @keyframes blow {
            0%   { transform: translateX(-100vw) translateY(0);  opacity: 0; }
            10%  { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateX(100vw) translateY(20px); opacity: 0; }
        }

        /* ---------- СМОЛЬ: туман ---------- */
        .fog {
            position: absolute;
            background: radial-gradient(circle, rgba(77, 136, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: float-side linear infinite alternate;
        }
        @keyframes float-side {
            0%   { transform: translateX(-80px) scale(1);   opacity: 0.2; }
            100% { transform: translateX(80px)  scale(1.2); opacity: 0.7; }
        }

        /* ================= ЭКРАНЫ ================= */
        .screen {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 20;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        .selection-container { text-align: center; width: 90%; max-width: 900px; z-index: 25; }
        .selection-title {
            color: #fff; font-size: 32px; letter-spacing: 8px;
            text-transform: uppercase; margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(160, 180, 255, 0.5);
        }
        .books-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
        }
        .book-btn {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 30px 20px; color: #fff;
            font-family: 'Georgia', serif; font-size: 18px; cursor: none;
            transition: all 0.3s ease; height: 150px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .book-btn span { font-size: 14px; opacity: 0.5; margin-top: 10px; font-style: italic; }
        .book-btn:hover {
            transform: translateY(-5px); background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .book-btn[data-book="flame"]:hover { border-color: #e8c39e; color: #e8c39e; }
        .book-btn[data-book="steel"]:hover { border-color: #a82a2a; color: #d0d0d5; }
        .book-btn[data-book="house"]:hover { border-color: #d4af37; color: #f4d03f; }
        .book-btn[data-book="sapphires"]:hover { border-color: #1a44a1; color: #8ab4f8; }

        .card-wrapper { position: relative; z-index: 25; width: 90%; max-width: 560px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--card-border); border-radius: 25px;
            padding: 35px 25px; text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 60px var(--glow-color);
            transition: all 0.6s ease; position: relative;
        }
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: transparent; border: 1px solid var(--card-border);
            color: var(--accent-color); padding: 8px 15px; border-radius: 20px;
            cursor: none; font-family: 'Georgia', serif; font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: var(--btn-bg); border-color: var(--accent-color); }
        .card h1 {
            font-size: 26px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--title-color); text-shadow: 0 0 20px var(--glow-color);
            margin-bottom: 5px; margin-top: 15px; transition: color 0.6s;
        }
        .card .author {
            font-size: 16px; letter-spacing: 6px; color: var(--accent-color);
            font-style: italic; border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px; margin-bottom: 20px; transition: color 0.6s;
        }
        .prediction-box {
            min-height: 140px; display: flex; align-items: center; justify-content: center;
            padding: 15px; margin-bottom: 25px; border-radius: 15px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
            transition: border 0.6s;
        }
        .prediction-text {
            font-size: 19px; line-height: 1.5; color: var(--text-color);
            font-style: italic; text-shadow: 0 0 20px var(--glow-color);
            transition: opacity 0.4s ease, transform 0.4s ease, color 0.6s;
        }
        .prediction-text.fade { opacity: 0; transform: scale(0.95); }
        .btn {
            padding: 14px 40px; background: var(--btn-bg); color: var(--title-color);
            font-size: 16px; font-family: 'Georgia', serif; letter-spacing: 2px;
            text-transform: uppercase; border: 1px solid var(--card-border);
            border-radius: 50px; cursor: none; transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); border-color: var(--accent-color); }

        #dragon-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; will-change: transform;
            opacity: 0; transition: opacity 0.5s ease;
            display: flex; justify-content: center; align-items: center;
        }
        #dragon-container.visible { opacity: 1; }
        #dragon-container img {
            width: 300px; height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 80, 0, 0.5));
        }

        @media (max-width: 640px) {
            #dragon-container img { width: 180px; }
            .card { padding: 25px 15px; }
            .card h1 { font-size: 20px; }
            .prediction-text { font-size: 16px; }
            .books-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-neutral">

                    "Не бойся смотреть в прошлое, иначе будущее останется закрытой дверью.",
                    "Твой путь усыпан песком, но твоя воля — сталь. Ты справишься.",
                    "Иногда, чтобы вернуться домой, нужно пройти через ад.",
                    "Время — это иллюзия, но любовь — вечна.",
                    "Секреты прошлого хранят ключи к твоему будущему.",
                    "Тот, кто пытается тебя остановить, боится твоей силы.",
                    "Воды океана не смогут смыть твою тоску по дому, но они укажут верный путь.",
                    "Ты создашь свой собственный дом, в котором будет место для всех, кого ты любишь.",
                    "Тот, кто выжил в пустыне, сможет выжить где угодно. Ты уже победитель.",
                    "Твоя находчивость — твой главный козырь. Используй её.",
                    "Не все монстры выглядят как чудовища. Иногда они предлагают тебе воду.",
                    "Твой брат всегда будет в твоем сердце. Он — твой компас.",
                    "Время лечит, но оно же и открывает старые раны. Будь готова.",
                    "Тот, кто ищет тебя, возможно, ищет не то, что ты думаешь.",
                    "Твой путь домой лежит через принятие себя.",
                    "Каждый шаг по песку приближает тебя к разгадке.",
                    "Ты сильнее, чем кажешься. Пустыня проверяет на прочность.",
                    "Не бойся одиночества. Иногда именно в тишине приходят ответы.",
                    "Твой дом ждет тебя. Всё остальное — лишь декорации.",
                    "Когда ты найдешь свой дом, ты поймешь, зачем все это было.",
                    "Ты — свет в пустыне. Не дай ему погаснуть.",
                    "Верь в себя. Пустыня не терпит сомнений."
                ]
            },
            sapphires: {
                title: "Смоль и сапфиры",
                theme: "theme-sapphires",
                effect: "bg-fog",
                cursor: "cursor-sapphire.gif",   // ⚠️ sapphire, не sapphires
                dragon: false,
                predictions: [
                    "В мире, полном монстров, питающихся кровью, ты и сама монстр, Лайла. Но любовь способна приручить тьму.",
                    "Смоль его глаз скрывает сапфиры души. Загляни глубже, прежде чем судить.",
                    "Твоя тень всегда следует за тобой, но иногда она прячет самое важное.",
                    "Не бойся окровавленных рук того, кто готов отдать за тебя жизнь.",
                    "Сапфир на твоем пальце — не просто украшение. Это ключ к его сердцу.",
                    "Тайны ночи откроются тому, кто не побоится заглянуть в глаза чудовищу.",
                    "В этом дворце каждый носит маску. Сними свою, и ты найдешь союзников.",
                    "Киран — не тот, кем кажется. Его тьма — лишь защита от еще большей боли.",
                    "Доверие — самая редкая драгоценность. Не разбрасывайся ею.",
                    "Тот, кто охотится на тебя, сам станет твоей добычей.",
                    "Твоя кровь — это дар, а не проклятие. Научись им пользоваться.",
                    "В мире, где правят вампиры, твоя человечность — твое главное оружие.",
                    "Когда смоль смешается с сапфирами, родится нечто новое и прекрасное.",
                    "Он выкупил твою свободу, но ты забрала его сердце. Честная сделка.",
                    "Ты — не жертва. Ты — хищник, который еще не понял своей силы.",
                    "Луна знает твои секреты. Доверься её свету.",
                    "Тот, кто боится тебя, не сможет причинить тебе вреда.",
                    "В темноте легче скрыть свою сущность. Но помни, кто ты.",
                    "Твоя жизнь стоит больше, чем миллион таллинов. Ты бесценна.",
                    "Киран не бросит тебя. Даже в самой кромешной тьме он будет рядом.",
                    "Не позволяй прошлому диктовать твое будущее. Ты сильнее.",
                    "Ищейка найдет тебя, где бы ты ни была. Но найдет ли он твое сердце?",
                    "Твоя уязвимость — это не слабость. Это твоя сила.",
                    "Тот, кто хочет тебя использовать, сам станет инструментом в твоих руках.",
                    "Ночь скрывает много тайн. Но твоя тайна — самая опасная.",
                    "Когда придет время, ты узнаешь, кому можно доверять. А кому — нет.",
                    "Твоя сила — в способности выживать там, где другие сдаются.",
                    "Любовь вампира — это навсегда. Готова ли ты к этому?",
                    "Ты — не просто игрушка в его руках. Ты — его спасение.",
                    "В конце концов, ты сама решишь, кем тебе быть: жертвой или хищником."
                ]
            }
        };

        /* ============ ЭЛЕМЕНТЫ ============ */
        let currentBookId = null;
        const selectionScreen  = document.getElementById('selection-screen');
        const predictionScreen = document.getElementById('prediction-screen');
        const dragonContainer  = document.getElementById('dragon-container');
        const bookTitleEl      = document.getElementById('bookTitle');
        const predText         = document.getElementById('predictionText');
        const btnPredict       = document.getElementById('btnPredict');
        const btnBack          = document.getElementById('btnBack');
        const customCursor     = document.getElementById('custom-cursor');

        /* ============ КУРСОР ============ */
        // По умолчанию — GIF cursor-default.gif (если нет — SVG через onerror)
        customCursor.src = DEFAULT_CURSOR;
        customCursor.classList.add('active');

        // Fallback: если GIF-курсор не загрузился — подставляем SVG
        customCursor.addEventListener('error', () => {
            const key = currentBookId || 'default';
            if (!customCursor.src.startsWith('data:')) {
                console.warn(`❌ Курсор "${customCursor.getAttribute('src')}" не найден — использую SVG для "${key}"`);
                customCursor.src = SVG_CURSORS[key] || SVG_CURSORS.default;
            }
        });

        /* ============ ДИАГНОСТИКА ДРАКОНА ============ */
        document.getElementById('dragonImg').addEventListener('error', () =>
            console.warn('❌ Не найден файл: "dragon.gif"')
        );
        document.getElementById('dragonImg').addEventListener('load', () =>
            console.log('✅ Загружен: "dragon.gif"')
        );

        /* ============ ГЕНЕРАЦИЯ ФОНОВЫХ ЭФФЕКТОВ ============ */
        function generateEffects() {
            // ----- Нейтральный: звёзды -----
            const neutralCont = document.getElementById('bg-neutral');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 4) + 's';
                neutralCont.appendChild(star);
            }
            // ----- Нейтральный: пылинки -----
            for (let i = 0; i < 25; i++) {
                const dust = document.createElement('div');
                dust.className = 'dust';
                const size = Math.random() * 8 + 3;
                dust.style.width = size + 'px';
                dust.style.height = size + 'px';
                dust.style.left = Math.random() * 100 + '%';
                dust.style.top = (100 + Math.random() * 20) + '%';
                dust.style.animationDuration = (Math.random() * 12 + 10) + 's';
                dust.style.animationDelay = (Math.random() * 10) + 's';
                neutralCont.appendChild(dust);
            }

            // ----- Монстры: искры -----
            const ashCont = document.getElementById('bg-ash');
            for (let i = 0; i < 80; i++) {
                const a = document.createElement('div');
                a.className = 'ash';
                const size = Math.random() * 4 + 2;
                a.style.width = size + 'px'; a.style.height = size + 'px';
                a.style.left = Math.random() * 100 + '%';
                a.style.animationDuration = (Math.random() * 4 + 3) + 's';
                a.style.animationDelay = (Math.random() * 5) + 's';
                ashCont.appendChild(a);
            }

            // ----- Дом: песок -----
            const sandCont = document.getElementById('bg-sand');
            for (let i = 0; i < 60; i++) {
                const s = document.createElement('div');
                s.className = 'sand';
                const size = Math.random() * 3 + 1;
                s.style.width = size + 'px'; s.style.height = size + 'px';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDuration = (Math.random() * 3 + 2) + 's';
                s.style.animationDelay = (Math.random() * 3) + 's';
                sandCont.appendChild(s);
            }

            // ----- Смоль: туман -----
            const fogCont = document.getElementById('bg-fog');
            for (let i = 0; i < 12; i++) {
                const f = document.createElement('div');
                f.className = 'fog';
                const size = Math.random() * 300 + 150;
                f.style.width = size + 'px'; f.style.height = size + 'px';
                f.style.left = Math.random() * 100 + '%';
                f.style.top = Math.random() * 100 + '%';
                f.style.animationDuration = (Math.random() * 8 + 8) + 's';
                f.style.animationDelay = (Math.random() * 5) + 's';
                fogCont.appendChild(f);
            }
        }
        generateEffects();

        /* ============ ЛОГИКА КНИГ ============ */
        document.querySelectorAll('.book-btn').forEach(btn => {
            btn.addEventListener('click', () => openBook(btn.getAttribute('data-book')));
        });

        function setActiveEffect(effectId) {
            document.querySelectorAll('.bg-effect').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(effectId);
            if (el) el.classList.add('active');
        }

        function openBook(bookId) {
            currentBookId = bookId;
            const book = booksData[bookId];

            document.body.className = book.theme;

            // Фон: у книг либо свой эффект, либо нейтральный
            if (book.effect && book.effect !== "none") {
                setActiveEffect(book.effect);
            } else {
                setActiveEffect('bg-neutral');
            }

            // Курсор: GIF если есть, иначе SVG
            if (book.cursor) {
                customCursor.src = book.cursor;
            } else {
                customCursor.src = SVG_CURSORS[bookId] || SVG_CURSORS.default;
            }
            customCursor.classList.add('active');

            // Дракон
            if (book.dragon) dragonContainer.classList.add('visible');
            else             dragonContainer.classList.remove('visible');

            bookTitleEl.textContent = book.title;
            predText.textContent = getRandomPrediction(book.predictions);

            selectionScreen.classList.remove('active');
            predictionScreen.classList.add('active');
        }

        function goBack() {
            predictionScreen.classList.remove('active');
            selectionScreen.classList.add('active');

            document.body.className = 'theme-neutral';
            setActiveEffect('bg-neutral');
            dragonContainer.classList.remove('visible');

            currentBookId = null;
            customCursor.src = DEFAULT_CURSOR;   // снова нейтральный GIF (при 404 → SVG)
        }

        btnBack.addEventListener('click', goBack);

        function getRandomPrediction(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        btnPredict.addEventListener('click', () => {
            if (!currentBookId) return;
            const book = booksData[currentBookId];
            predText.classList.add('fade');
            setTimeout(() => {
                predText.textContent = getRandomPrediction(book.predictions);
                predText.classList.remove('fade');
            }, 350);
        });

        /* ============ ДВИЖЕНИЕ КУРСОРА И ДРАКОНА ============ */
        let targetX = window.innerWidth / 2, targetY = window.innerHeight / 2;
        let currentX = targetX, currentY = targetY;

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            customCursor.style.left = targetX + 'px';
            customCursor.style.top  = targetY + 'px';
        });

        function animate() {
            const dx = targetX - currentX;
            const dy = targetY - currentY;
            currentX += dx * 0.1;
            currentY += dy * 0.1;
            dragonContainer.style.transform = `translate(${currentX - 150}px, ${currentY - 125}px)`;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
